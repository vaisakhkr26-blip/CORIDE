name: Build CoRide APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Server address the app connects to (your PC's IP, e.g. http://192.168.1.10:3000)"
        required: true
        default: "http://192.168.1.10:3000"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create the Android project around our code
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --org in.coride --project-name coride --platforms=android .
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -f test/widget_test.dart
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' "$M"
          grep -n "INTERNET\|usesCleartextTraffic" "$M"

      - run: flutter pub get
      - run: flutter test

      - name: Build the APK
        run: flutter build apk --release --dart-define=API_URL=${{ github.event.inputs.api_url }}

      - uses: actions/upload-artifact@v4
        with:
          name: coride-apk
          path: build/app/outputs/flutter-apk/app-release.apk
